<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Focus Guard</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header id="session-header" class="hidden">
        <div class="header-copy">
          <div id="status-line" class="status-line hidden"><span class="live-dot"></span><span id="elapsed-label"></span></div>
        </div>
        <button id="stop" class="text-button hidden" type="button">End</button>
      </header>

      <section id="start-view">
        <label class="prompt" for="goal">What are you focusing on?</label>
        <textarea id="goal" rows="5" maxlength="8000" placeholder="For example: Learn how JEV makes decisions. Documentation, technical articles, and relevant videos are useful. Avoid unrelated feeds and entertainment."></textarea>
        <fieldset class="allowances">
          <label class="allowance-toggle" for="allow-music">
            <input id="allow-music" type="checkbox">
            <span>Allow music</span>
          </label>
          <label class="allowance-toggle" for="allow-sns">
            <input id="allow-sns" type="checkbox">
            <span>Allow SNS</span>
          </label>
          <label class="allowance-toggle" for="allow-youtube">
            <input id="allow-youtube" type="checkbox">
            <span>Allow YouTube</span>
          </label>
        </fieldset>
        <p id="setup-note" class="note hidden">Connect JEV in Settings before starting.</p>
        <button id="start" class="primary" type="button">
          <span>Start focus</span><span aria-hidden="true">→</span>
        </button>
        <p class="disclosure">Your focus and limited page metadata are sent to your selected provider for a decision. Hosted mode relays them through Focus Guard without storing URLs, titles, page metadata, or decisions. <a href="privacy.html" target="_blank">Privacy policy</a></p>
      </section>

      <section id="active-view" class="hidden">
        <p id="active-goal" class="active-goal"></p>
        <p id="active-allowances" class="active-allowances"></p>
      </section>

      <section id="page-section" class="page-section">
        <div class="page-row">
          <div class="page-identity">
            <img id="page-icon" class="page-icon" src="icons/icon-32.png" alt="">
            <div class="page-copy">
              <strong id="page-title" class="page-title">No page selected</strong>
              <span id="page-url" class="page-url"></span>
            </div>
          </div>
          <span id="decision-badge" class="badge neutral">Checking</span>
        </div>
        <p id="decision-reason" class="decision-reason"></p>
        <div id="decision-meta" class="decision-meta hidden">
          <span id="confidence"></span>
          <span id="source"></span>
        </div>
      </section>

      <footer>
        <span id="activity-count" class="activity-count"></span>
        <span id="usage-count" class="activity-count"></span>
        <div class="footer-actions">
          <button id="recheck" class="quiet-button hidden" type="button">Check again</button>
          <button id="settings" class="icon-button" type="button" aria-label="Open settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0-7Zm8 3.5-.1-1.2 2-1.5-2-3.4-2.4 1a8.7 8.7 0 0 0-2-1.2L15.2 3h-4L10.8 5.7c-.7.3-1.4.7-2 1.2l-2.4-1-2 3.4 2 1.5A8 8 0 0 0 6.3 12l.1 1.2-2 1.5 2 3.4 2.4-1c.6.5 1.3.9 2 1.2l.4 2.7h4l.4-2.7c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.5.1-1.2Z"/>
            </svg>
          </button>
        </div>
      </footer>
      <p id="message" class="message" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
